name: GhostRepo health scan

# Dogfooding: GhostRepo scans itself on a schedule.
# Copy this file into your own repository to scan it instead —
# it only needs Node 20 and a GITHUB_TOKEN (provided automatically).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build:packages

      - name: Scan repository
        env:
          GHOSTREPO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node cli/dist/index.js report ${{ github.repository }} --markdown --html

      - name: Summary
        run: cat ghostrepo-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ghostrepo-report
          path: |
            ghostrepo-report.json
            ghostrepo-report.md
            ghostrepo-report.html
